<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B6E79">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="حاضر">
<title>حاضر – تسجيل حضور المحاضرات</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">
<style>
:root{--ui:'Cairo','Segoe UI',Tahoma,'Noto Sans Arabic',system-ui,sans-serif;--mono:ui-monospace,'Cascadia Mono',Consolas,Menlo,monospace;
 --bg:#F4F6F9;--surface:#fff;--surface-2:#EAEFF6;--ink:#14213D;--muted:#4B5870;--line:#D3DBE6;--accent:#0B6E79;--on-accent:#fff;
 --good:#17683F;--good-bg:#E3F4EA;--warn:#8F4400;--warn-bg:#FFF1DD;--bad:#B3261E;--bad-bg:#FDE9E7}
@media (prefers-color-scheme:dark){:root{--bg:#0F1623;--surface:#172033;--surface-2:#1F2A41;--ink:#E8EDF7;--muted:#A9B5CB;--line:#2C3956;--accent:#4FC3CF;--on-accent:#08222A;
 --good:#6FD7A3;--good-bg:#12301F;--warn:#F4AA62;--warn-bg:#33230F;--bad:#FF9C94;--bad-bg:#3A1816;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
#app{max-width:760px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
button,input,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1{margin:0;font-size:26px;line-height:1.25}h2{margin:0;font-size:20px;line-height:1.35}h3{margin:16px 0 4px;font-size:16px}
p{margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand p{color:var(--muted);font-size:14px}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
main{display:grid;gap:14px;margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px}
.card.auth{max-width:480px;margin-inline:auto;width:100%}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.link{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;padding:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.row.between{justify-content:space-between}.row.center{justify-content:center}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;background:var(--surface-2)}
.seg button{flex:1;min-height:42px;border:0;border-radius:9px;background:transparent;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.fld{display:grid;gap:4px}.fld>label,.keybox>label{font-weight:600;font-size:15px}
.hint{font-size:13.5px;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=search],input[type=date],select{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px 12px}
.chk{display:flex;gap:10px;align-items:center;font-weight:400!important;padding:4px 0}.chk input{width:20px;height:20px}
.muted{color:var(--muted)}.center{text-align:center}
.pill{display:inline-block;padding:1px 10px;border-radius:999px;background:var(--surface-2);font-size:13px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.banner{margin-top:10px;padding:8px 12px;border:1px solid var(--warn);color:var(--warn);background:var(--warn-bg);border-radius:10px;font-size:14px}
.flash{margin-top:10px;padding:10px 14px;border-radius:10px;font-size:15px;font-weight:600}
.flash[hidden]{display:none}
.flash.good{background:var(--good-bg);color:var(--good)}.flash.bad{background:var(--bad-bg);color:var(--bad)}.flash.warn{background:var(--warn-bg);color:var(--warn)}
.who{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:18px}
.code{font-family:var(--mono);background:var(--surface-2);border-radius:10px;padding:10px 12px;word-break:break-all;user-select:all}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:start;padding:12px;margin-top:8px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.item.static{cursor:default}.it{display:grid}
.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.counts div{background:var(--surface-2);border-radius:12px;padding:8px;text-align:center;display:grid}
.counts b{font-size:26px;line-height:1.2}.counts span{font-size:12.5px;color:var(--muted)}
.qrbox{display:grid;gap:8px;justify-items:center}
.qrimg{width:min(100%,320px);aspect-ratio:1;border-radius:12px;overflow:hidden;background:#fff;border:1px solid var(--line)}
.qrimg svg{display:block;width:100%;height:100%}
.keybox{display:grid;gap:6px;justify-items:center;padding-top:8px}
.bigkey{font-family:var(--mono);font-size:40px;font-weight:700;letter-spacing:.2em;background:var(--surface-2);border-radius:12px;padding:6px 18px;direction:ltr}
.rowi{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rowi .nm{flex:1;min-width:0;overflow-wrap:anywhere}.rowi .num{width:28px;color:var(--muted);text-align:center;font-size:14px}.rowi .tm{font-family:var(--mono);font-size:13px}
.grp{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.camwrap{border-radius:14px;overflow:hidden;background:#000;aspect-ratio:3/4;max-height:60vh;margin-inline:auto;width:100%;max-width:420px}
.camwrap video{width:100%;height:100%;object-fit:cover;display:block}
.keyin{width:100%;min-height:56px;text-align:center;font-family:var(--mono);font-size:30px;letter-spacing:.35em;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:6px;direction:ltr}
.bigcheck{width:84px;height:84px;margin:0 auto;border-radius:50%;background:var(--good-bg);color:var(--good);font-size:52px;line-height:84px;font-weight:700}
#printArea{display:none}
@media print{
 body.printing #app{display:none}
 body.printing #printArea{display:block;color:#000;background:#fff;padding:0;font-family:var(--ui)}
 body.printing{background:#fff}
 #printArea h1{font-size:22px;margin-bottom:6px}
 #printArea table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
 #printArea th,#printArea td{border:1px solid #888;padding:4px 8px;text-align:start}
 #printArea th{background:#eee}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="printArea"></div>

   It imitates the main security rules so the demo behaves like the real thing. */
window.__createDemo=function(){
  const KEY='hdr.demo.db', UKEY='hdr.demo.users', CKEY='hdr.demo.cur';
  const bc=('BroadcastChannel' in window)?new BroadcastChannel('hdr.demo'):null;
  const subs=new Set(); const authSubs=new Set();
  const TS={__ts:1};
  const rd=k=>{try{return JSON.parse(localStorage.getItem(k)||'{}')||{};}catch(e){return {};}};
  const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
  let curMem=null;
  const getCur=()=>{try{return JSON.parse(sessionStorage.getItem(CKEY)||'null');}catch(e){return curMem;}};
  const setCur=u=>{curMem=u;try{if(u)sessionStorage.setItem(CKEY,JSON.stringify(u));else sessionStorage.removeItem(CKEY);}catch(e){}authSubs.forEach(f=>f(u));};
  const err=code=>{const e=new Error(code);e.code=code;return e;};
  function notify(){subs.forEach(f=>f());}
  if(bc)bc.onmessage=notify;
  window.addEventListener('storage',e=>{if(e.key===KEY)notify();});
  const clone=o=>o===undefined?undefined:JSON.parse(JSON.stringify(o));
  const fix=(d,prev)=>{const o={};for(const k in d){const v=d[k];o[k]=(v&&v.__ts)?Date.now():(v&&v.__inc!==undefined)?((prev&&typeof prev[k]==='number'?prev[k]:0)+v.__inc):v;}return o;};
  const isLect=(db,u)=>!!(u&&db['lecturers/'+u.email]);
  /* a few of the real rules, enough for the demo to refuse what the cloud would refuse */
  function allow(db,op,path,data){
    const u=getCur(); if(!u)throw err('permission-denied');
    const p=path.split('/');
    if(p[0]==='sessions'&&p.length===2){
      if(op==='create'){ if(!isLect(db,u)||data.lecturerUid!==u.uid)throw err('permission-denied'); }
      else if(op!=='read'){ const s=db[path]; if(!isLect(db,u)||!s||s.lecturerUid!==u.uid)throw err('permission-denied'); }
    }else if(p[0]==='sessions'&&p[2]==='secret'){
      const s=db['sessions/'+p[1]]; if(!isLect(db,u)||!s||s.lecturerUid!==u.uid)throw err('permission-denied');
    }else if(p[0]==='sessions'&&p[2]==='attendance'){
      const s=db['sessions/'+p[1]]; const owner=s&&isLect(db,u)&&s.lecturerUid===u.uid;
      if(op==='read'){ if(!(owner||u.uid===p[3]||isLect(db,u)))throw err('permission-denied'); return; }
      if(owner)return;
      if(op!=='create'||u.uid!==p[3]||!s||s.status!=='open')throw err('permission-denied');
      const sec=db['sessions/'+p[1]+'/secret/current']; const me=db['users/'+u.uid];
      if(!sec||!me||data.name!==me.name)throw err('permission-denied');
      const m=s.methods||{};
      if(data.method==='key'){ if(!m.key||data.proof!==sec.key)throw err('permission-denied'); }
      else if(data.method==='qr'){ if(!m.qr||Date.now()>sec.qrAt+45000||(data.proof!==sec.qr&&data.proof!==sec.qrPrev))throw err('permission-denied'); }
      else throw err('permission-denied');
    }else if(p[0]==='lecturers'){
      if(op!=='read'&&!isLect(db,u))throw err('permission-denied');
    }
  }
  const cols=(db,col,w)=>Object.keys(db).filter(k=>k.indexOf(col+'/')===0&&k.slice(col.length+1).indexOf('/')<0)
    .map(k=>Object.assign({id:k.slice(col.length+1)},clone(db[k])))
    .filter(d=>(w||[]).every(c=>d[c[0]]===c[2]));
  return {
    mode:'demo', TS:TS, inc:n=>({__inc:n}),
    auth:{
      onChange:cb=>{authSubs.add(cb);setTimeout(()=>cb(getCur()),0);return()=>authSubs.delete(cb);},
      signUp:async(e,p)=>{
        e=String(e||'').trim().toLowerCase(); if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e))throw err('auth/invalid-email');
        if(String(p||'').length<6)throw err('auth/weak-password');
        const us=rd(UKEY); if(us[e])throw err('auth/email-already-in-use');
        const u={uid:'u'+Math.random().toString(36).slice(2,10),email:e}; us[e]={pw:p,uid:u.uid}; wr(UKEY,us); setCur(u); return u;},
      signIn:async(e,p)=>{
        e=String(e||'').trim().toLowerCase(); const us=rd(UKEY);
        if(!us[e]||us[e].pw!==p)throw err('auth/invalid-credential');
        const u={uid:us[e].uid,email:e}; setCur(u); return u;},
      signOut:async()=>{setCur(null);},
      reset:async e=>{}
    },
    get:async p=>{const d=rd(KEY); return d[p]===undefined?null:clone(d[p]);},
    set:async(p,data,merge)=>{const d=rd(KEY); const ex=d[p]!==undefined; const nd=fix(data,ex?d[p]:null);
      allow(d,ex?'update':'create',p,merge&&ex?Object.assign({},d[p],nd):nd);
      d[p]=merge&&ex?Object.assign({},d[p],nd):nd; wr(KEY,d); if(bc)bc.postMessage(1); notify();},
    update:async(p,data)=>{const d=rd(KEY); if(d[p]===undefined)throw err('not-found'); const nd=Object.assign({},d[p],fix(data,d[p])); allow(d,'update',p,nd); d[p]=nd; wr(KEY,d); if(bc)bc.postMessage(1); notify();},
    del:async p=>{const d=rd(KEY); allow(d,'delete',p,null); delete d[p]; wr(KEY,d); if(bc)bc.postMessage(1); notify();},
    batch:async ops=>{const d=rd(KEY); const n=clone(d);
      ops.forEach(o=>{ if(o.op==='del'){allow(d,'delete',o.path,null);delete n[o.path];}
        else{const ex=d[o.path]!==undefined; const nd=fix(o.data,n[o.path]); allow(d,ex?'update':'create',o.path,nd); n[o.path]=o.merge&&n[o.path]?Object.assign({},n[o.path],nd):nd;} });
      wr(KEY,n); if(bc)bc.postMessage(1); notify();},
    watchDoc:(p,cb)=>{let last='';const f=()=>{const d=rd(KEY);const v=d[p]===undefined?null:clone(d[p]);const s=JSON.stringify(v);if(s!==last){last=s;cb(v);}};subs.add(f);setTimeout(f,0);return()=>subs.delete(f);},
    watchQuery:(col,w,cb,onErr)=>{let last='';const f=()=>{const d=rd(KEY);try{allow(d,'read',col+'/x',null);}catch(e){}const v=cols(d,col,w);const s=JSON.stringify(v);if(s!==last){last=s;cb(v);}};subs.add(f);setTimeout(f,0);return()=>subs.delete(f);},
    query:async(col,w)=>cols(rd(KEY),col,w),
    seedLecturer:async(email,name)=>{const d=rd(KEY);d['lecturers/'+email]={name:name||''};wr(KEY,d);if(bc)bc.postMessage(1);notify();}
  };
};
</script>

  const demo=st.get('hdr.demo')==='1';
  if(demo){B=window.__createDemo();}
  else if(hasCfg){
    try{B=window.__createFirebase(CFG.firebase);}catch(e){S.view='setup';render();return;}
  }else{S.view='setup';render();return;}
  render();
  B.auth.onChange(async function(u){
    if(S.signingUp)return;
    cleanup();S.user=u;
    if(!u){S.profile=null;S.isLecturer=false;S.isAdmin=false;S.view='auth';render();return;}
    await enter();
  });
}
async function enter(){
  try{
    const u=S.user;
    S.profile=await B.get('users/'+u.uid);
    S.isLecturer=!!(await B.get('lecturers/'+u.email));
    S.isAdmin=!!ADMIN&&u.email===ADMIN;
    if(S.isAdmin&&!S.isLecturer){try{await B.set('lecturers/'+u.email,{name:S.profile?S.profile.name:''});S.isLecturer=true;}catch(e){}}
    if(!S.profile){S.view='profile';S.form={name:'',level:'1',sid:'',role:'student',create:true};render();return;}
    home();
  }catch(e){S.view='auth';render();flash('bad',errText(e));}
}
function home(){
  cleanup();S.result=null;
  if(S.isLecturer){
    S.view='lhome';render();
    track(B.watchQuery('sessions',[['lecturerUid','==',S.user.uid]],function(list){S.sessions=list.sort((a,b)=>(b.startedAt||0)-(a.startedAt||0));if(S.view==='lhome')paintLhome();},function(e){flash('bad',errText(e));}));
  }else if(S.profile.role==='lecturer'){
    S.view='pending';render();
  }else{
    S.view='shome';render();
    const L=S.profile.level;
    track(B.watchQuery('sessions',[['status','==','open'],['level','==',L]],function(list){S.open=list;checkDone();if(S.view==='shome')paintShome();},function(e){flash('bad',errText(e));}));
    track(B.watchQuery('stats',[['level','==',L]],function(list){S.stats=list;if(S.view==='shome')paintShome();},function(){}));
    track(B.watchQuery('users/'+S.user.uid+'/courses',[],function(list){S.courses=list;if(S.view==='shome')paintShome();},function(){}));
    if(S.pending){const p=S.pending;S.pending=null;doAttend(p.sid,'qr',p.token);}
  }
}

async function checkDone(){
  for(const x of S.open){ if(S.done[x.id]!==undefined)continue; S.done[x.id]=false;
    try{S.done[x.id]=!!(await B.get('sessions/'+x.id+'/attendance/'+S.user.uid));}catch(e){} }
  if(S.view==='shome')paintShome();
}

async function openSession(sid){
  S.sid=sid;S.ses=S.sessions.find(x=>x.id===sid)||null;S.att=[];S.roster=[];S.rosterFor=null;S.search='';S.secret=null;S.showP=100;S.showA=100;
  cleanup();S.view='session';render();
}
async function initSession(){
  const sid=S.sid;
  track(B.watchDoc('sessions/'+sid,function(d){
    if(!d)return; S.ses=Object.assign({id:sid},d); paintSessionTop(); paintCodes();
    if(S.rosterFor!==d.level){ S.rosterFor=d.level; loadRoster(d.level,false); }
  },function(e){flash('bad',errText(e));}));
  track(B.watchQuery('sessions/'+sid+'/attendance',[],function(list){S.att=list;paintLists();},function(e){flash('bad',errText(e));}));
  try{
    S.secret=await B.get('sessions/'+sid+'/secret/current');
    if(!S.secret){S.secret={key:newKey(),qr:rnd(10),qrPrev:''};await writeSecret();}
  }catch(e){flash('bad',errText(e));}
  paintCodes();paintSessionTop();paintLists();
  if(S.ses&&S.ses.status==='open'){getWake();rotateQr();}
  timer=setInterval(tick,1000);
  S.lastRot=Date.now();
}
async function loadRoster(level,force){
  const c=S.rosterCache[level];
  if(c&&!force&&Date.now()-c.at<600000){S.roster=c.list;paintLists();return;}
  try{const list=await B.query('users',[['role','==','student'],['level','==',level]]);S.rosterCache[level]={list:list,at:Date.now()};S.roster=list;paintLists();}
  catch(e){flash('bad',errText(e));}
}
async function writeSecret(){
  await B.set('sessions/'+S.sid+'/secret/current',{key:S.secret.key,qr:S.secret.qr,qrPrev:S.secret.qrPrev||'',qrAt:B.TS});
}
async function rotateQr(){
  if(!S.secret||!S.ses||S.ses.status!=='open'||!(S.ses.methods&&S.ses.methods.qr))return;
  S.secret={key:S.secret.key,qr:rnd(10),qrPrev:S.secret.qr};S.lastRot=Date.now();
  try{await writeSecret();}catch(e){}
  paintQr();
}
function tick(){
  if(S.view!=='session')return;
  const left=Math.max(0,20-Math.floor((Date.now()-(S.lastRot||0))/1000));
  const el=$('qrLeft');if(el)el.textContent=t('refreshIn',{n:left});
  if(Date.now()-(S.lastRot||0)>=20000)rotateQr();
}

function sheetRows(){
  const present=new Map(S.att.map(a=>[a.id,a]));
  const rows=[];
  S.roster.forEach(function(u){const a=present.get(u.id);rows.push({uid:u.id,name:u.name,email:u.email,sid:u.studentId||'',present:!!a,method:a?a.method:'',at:a?a.at:0});});

function exportCsv(){
  const s=S.ses;
  const head=[t('cName'),t('cEmail'),'ID',t('cStatus'),t('cMethod'),t('cTime')];
  const lines=[[t('course'),s.course].map(csvEscape).join(','),[t('date'),s.date].map(csvEscape).join(','),[t('level'),t('lv'+s.level)].map(csvEscape).join(','),'',head.map(csvEscape).join(',')];
  sheetData().forEach(r=>lines.push([r.name,r.email,r.sid,r.present?t('stP'):t('stA'),r.present?t('m_'+r.method):'',r.present?clock(r.at):''].map(csvEscape).join(',')));
  const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(s.course+'-'+s.date).replace(/[\\/:*?"<>|\s]+/g,'_')+'.csv';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
}

  setTimeout(function(){window.print();setTimeout(function(){document.body.classList.remove('printing');},500);},50);
}

async function doAttend(sid,method,proof){
  try{
    const ses=await B.get('sessions/'+sid);
    if(!ses||ses.status!=='open')throw {code:'closed'};
    const uid=S.user.uid;
    let ex=null; try{ex=await B.get('sessions/'+sid+'/attendance/'+uid);}catch(e){}
    if(ex){S.done[sid]=true;S.result={ses:ses,already:true};S.view='attend';stopScan();render();return;}
    const p=S.profile;
    try{
      await B.batch([
       {op:'set',path:'sessions/'+sid+'/attendance/'+uid,data:{uid:uid,name:p.name,email:p.email,studentId:p.studentId||'',method:method,proof:proof,at:B.TS}},
       {op:'set',merge:true,path:'users/'+uid+'/courses/'+(ses.courseKey||ckeyOf(ses.level,ses.course)),data:{course:ses.course,level:ses.level,count:B.inc(1),last:ses.date,lastAt:B.TS}}]);
    }catch(e){ if(e&&e.code==='permission-denied')throw {code:'wrong'}; throw e; }
    S.done[sid]=true;S.result={ses:ses,already:false};S.view='attend';stopScan();render();
  }catch(e){
    flash('bad',errText(e));
    if(S.view==='attend'&&S.tab==='scan'&&scan){scan.busy=false;scan.cool=Date.now()+3000;}
    if(S.view==='shome')render();
  }
}
/* ----- camera scanner ----- */
function stopScan(){if(scan){scan.done=true;clearTimeout(scan.t);try{scan.stream&&scan.stream.getTracks().forEach(function(x){x.stop();});}catch(e){}scan=null;}}
async function startScan(){
  stopScan();
  const v=$('cam'),msg=$('scanSt');if(!v)return;
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){if(msg)msg.textContent=t('camNeed');return;}
  const me={done:false,busy:false,stream:null,t:0,cool:0};scan=me;
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    if(me.done){stream.getTracks().forEach(function(x){x.stop();});return;}
    me.stream=stream;v.srcObject=stream;await v.play();
    const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
    const loop=function(){
      if(me.done)return;
      if(!me.busy&&Date.now()>me.cool&&v.readyState>=2&&v.videoWidth){
        const w=Math.min(640,v.videoWidth),h=Math.round(v.videoHeight*w/v.videoWidth);cv.width=w;cv.height=h;cx.drawImage(v,0,0,w,h);
        const img=cx.getImageData(0,0,w,h),c=jsQR(img.data,w,h,{inversionAttempts:'dontInvert'});
        const q=c&&parseQr(c.data);
        if(q){me.busy=true;doAttend(q.sid,'qr',q.token);}
      }
      me.t=setTimeout(loop,150);
    };
    loop();
  }catch(e){if(msg)msg.textContent=t('camNeed');}
}

/* ---------- Events ---------- */
const val=id=>{const e=$(id);return e?e.value:'';};
function readForm(){
  const f=S.form;
  if($('fEmail'))f.email=val('fEmail').trim();
  if($('fName'))f.name=val('fName');
  if($('fLevel'))f.level=val('fLevel');
  if($('fSid'))f.sid=val('fSid');
}
document.addEventListener('input',function(e){
  if(e.target&&e.target.id==='mSearch'){S.search=e.target.value;paintLists();}
});
document.addEventListener('click',async function(e){
  const b=e.target.closest('[data-act]');if(!b)return;
  const d=b.dataset;
  switch(d.act){
    case 'lang':readForm();lang=lang==='ar'?'en':'ar';st.set('hdr.lang',lang);render();break;
    case 'demo':st.set('hdr.demo','1');location.reload();break;
    case 'exitDemo':st.set('hdr.demo','0');location.reload();break;
    case 'authmode':readForm();S.authMode=d.v;render();break;
    case 'role':readForm();S.role=d.v;render();break;
    case 'logout':cleanup();await B.auth.signOut();break;
    case 'forgot':{
      const em=val('fEmail').trim().toLowerCase();if(!em){flash('warn',t('resetNeed'));break;}
      try{await B.auth.reset(em);flash('good',t('resetSent'));}catch(x){flash('bad',errText(x));}break;}
    case 'doSignin':{
      readForm();const em=val('fEmail').trim().toLowerCase(),pw=val('fPw');
      try{await B.auth.signIn(em,pw);}catch(x){flash('bad',errText(x));}break;}
    case 'doSignup':{
      readForm();
      const em=val('fEmail').trim().toLowerCase(),pw=val('fPw'),pw2=val('fPw2');
      const name=cleanName(val('fName')),role=S.role;
      if(role==='student'&&words(name).length<4){flash('bad',t('nameBad4'));break;}
      if(role==='lecturer'&&words(name).length<2){flash('bad',t('nameBad2'));break;}
      if(pw!==pw2){flash('bad',t('pwMis'));break;}
      S.signingUp=true;
      try{
        const u=await B.auth.signUp(em,pw);
        S.user=u;
        const prof={name:name,email:em,role:role,level:role==='student'?(val('fLevel')||'1'):'',studentId:role==='student'?val('fSid').trim():'',createdAt:B.TS};
        await B.set('users/'+u.uid,prof);
        if(B.mode==='demo'&&role==='lecturer')await B.seedLecturer(em,name);
        S.signingUp=false;S.form={};
        await enter();
      }catch(x){S.signingUp=false;flash('bad',errText(x));}
      break;}
    case 'saveProfile':{
      const name=cleanName(val('pName'));const create=!!S.form.create;
      const role=create?S.form.role:S.profile.role;
      if(role==='student'&&words(name).length<4){flash('bad',t('nameBad4'));break;}
      if(words(name).length<2){flash('bad',t('nameBad2'));break;}
      const data={name:name,email:S.user.email,role:role,level:role==='student'?val('pLevel'):'',studentId:role==='student'?val('pSid').trim():''};
      if(create)data.createdAt=B.TS;
      try{await B.set('users/'+S.user.uid,data,true);S.profile=Object.assign({},S.profile||{},data);flash('good',t('saved'));S.form={};home();}catch(x){flash('bad',errText(x));}
      break;}
    case 'profile':S.form={};cleanup();S.view='profile';render();break;
    case 'home':home();break;
    case 'newLec':cleanup();S.view='new';render();break;
    case 'startLec':{
      const course=cleanName(val('nCourse'));if(!course){flash('bad',t('needCourse'));break;}
      const qr=$('nQr').checked,key=$('nKey').checked;if(!qr&&!key){flash('bad',t('needMethod'));break;}
      const sid=rnd(12,'abcdefghjkmnpqrstuvwxyz23456789ABCDEFGHJKLMNPQRSTUVWXYZ');
      const level=val('nLevel');S.form.lastLevel=level;
      try{
        const ck=ckeyOf(level,course);
        await B.set('sessions/'+sid,{lecturerUid:S.user.uid,lecturerName:S.profile.name,course:course,courseKey:ck,date:val('nDate')||today(),level:level,methods:{qr:qr,key:key},status:'open',startedAt:B.TS});
        B.set('stats/'+ck,{course:course,level:level,total:B.inc(1)},true).catch(function(){});
        await B.set('sessions/'+sid+'/secret/current',{key:newKey(),qr:rnd(10),qrPrev:'',qrAt:B.TS});
        S.sessions=S.sessions.concat([{id:sid,lecturerUid:S.user.uid,lecturerName:S.profile.name,course:course,date:val('nDate')||today(),level:level,methods:{qr:qr,key:key},status:'open'}]);
        openSession(sid);
      }catch(x){flash('bad',errText(x));}
      break;}
    case 'openLec':openSession(d.id);break;
    case 'closeLec':try{await B.update('sessions/'+S.sid,{status:'closed',closedAt:B.TS});releaseWake();}catch(x){flash('bad',errText(x));}break;
    case 'reopenLec':try{await B.update('sessions/'+S.sid,{status:'open'});S.lastRot=0;getWake();}catch(x){flash('bad',errText(x));}break;
    case 'newKey':if(S.secret){S.secret.key=newKey();try{await writeSecret();paintQr();}catch(x){flash('bad',errText(x));}}break;
    case 'mark':markManual(d.id);break;
    case 'unmark':unmark(d.id);break;
    case 'walk':walkIn(S.search);break;
    case 'moreP':S.showP+=200;paintListsNow();break;
    case 'moreA':S.showA+=200;paintListsNow();break;
    case 'refreshRoster':loadRoster(S.ses.level,true);break;
    case 'csv':exportCsv();break;
    case 'print':printSheet();break;
    case 'goAttend':S.tab=d.v;S.result=null;stopScan();S.view='attend';render();break;
    case 'atab':stopScan();S.tab=d.v;S.result=null;render();break;
    case 'submitKey':{
      const key=val('keyIn').replace(/\D/g,'');if(key.length!==6){flash('bad',t('errBad'));break;}
      const sid=$('keySes')?val('keySes'):(S.open[0]&&S.open[0].id);if(!sid){flash('bad',t('noOpen'));break;}
      doAttend(sid,'key',key);break;}
    case 'admin':cleanup();S.view='admin';render();
      track(B.watchQuery('lecturers',[],function(l){S.lecturers=l;if(S.view==='admin')paintAdmin();},function(x){flash('bad',errText(x));}));break;
    case 'admAdd':{
      const em=val('aEmail').trim().toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){flash('bad',t('errEmailBad'));break;}
      try{await B.set('lecturers/'+em,{name:cleanName(val('aName'))});$('aEmail').value='';$('aName').value='';}catch(x){flash('bad',errText(x));}break;}
    case 'admDel':try{await B.del('lecturers/'+d.id);}catch(x){flash('bad',errText(x));}break;
  }
});
window.addEventListener('hashchange',function(){
  const m=/(?:^#|&)a=([^&]+)/.exec(location.hash); if(!m)return;
  const q=parseQr(decodeURIComponent(m[1])); history.replaceState(null,'',location.pathname+location.search); if(!q)return;
  if(S.user&&S.profile&&!S.isLecturer&&S.profile.role!=='lecturer'&&B){doAttend(q.sid,'qr',q.token);}else S.pending=q;
});
window.__hadir={qrSvg:qrSvg,parseQr:parseQr,S:S};
boot();
})();
